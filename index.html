<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olathe South High School's Computer Science Honor Society</title>
</head>
<body style="text-align: center; background-image: url(background.jpg); background-blend-mode: lighten; background-color: rgba(255, 255, 255, 0.9); background-repeat: none; background-attachment: fixed; background-size: cover;">
    <img alt="logo" src="logo.png" style="width: 75%; max-width: 120vh;">
    <h1 style="font-size: min(3.75vw, 5vh);">We promote our passion for computer science!</h1>
    <button onclick="member()" style="font-size: min(3vw, 4vh); background-color: lightblue;">I am a member</button><br><br>
    <button onclick="nonMember()" style="font-size: min(3vw, 4vh); background-color: lightblue;">I am not a member, but I am interested</button><br><br>
    <div id="information" style="display: none; overflow: auto; max-width: min(81vw, 108vh);">
        <div id="events">
            <h1 style="font-size: min(3.75vw, 5vh);">Current Events</h1>
            <div id="eventsContainer" style="background-color: lightblue;"></div>
        </div>
        <div id="moreInformation">
            <h1 style="font-size: min(3.75vw, 5vh);">More Information</h1>
            <a download="CSHS General Information.pdf" href="/CSHS General Information.pdf" style="font-size: min(3vw, 4vh)">Download CSHS General Information</a><br>
            <a download="CSHS Constitution.pdf" href="/CSHS Constitution.pdf" style="font-size: min(3vw, 4vh)">Download CSHS Constitution</a><br>
            <a download="CSHS Bylaws.pdf" href="/CSHS Bylaws.pdf" style="font-size: min(3vw, 4vh)">Download CSHS Bylaws</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
